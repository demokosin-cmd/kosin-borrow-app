<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 viewport-fit=cover">

  <title>ใบยืมสินค้าออนไลน์</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ใบยืมสินค้าออนไลน์">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#183A8F">

  <link rel="apple-touch-icon"
        sizes="180x180"
        href="./kosin-app-icon-180.png">

  <link rel="apple-touch-icon-precomposed"
        sizes="180x180"
        href="./kosin-app-icon-180.png">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./kosin-app-icon-192.png">

  <link rel="icon"
        type="image/png"
        sizes="512x512"
        href="./kosin-app-icon-512.png">

  <link rel="manifest"
        href="./manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        radial-gradient(
          circle at top,
          rgba(37,99,235,.12),
          transparent 40%
        ),
        linear-gradient(
          160deg,
          #ffffff 0%,
          #eef4ff 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .loader-screen {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 18px;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    .loader {
      width: 62px;
      height: 62px;

      border-radius: 50%;

      border-top: 5px solid #FF6B35;
      border-bottom: 5px solid #2563EB;

      border-left: 5px solid transparent;
      border-right: 5px solid transparent;

      animation: rotation 1s linear infinite;

      filter:
        drop-shadow(
          0 8px 18px rgba(37,99,235,.22)
        );
    }

    @keyframes rotation {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-message {
      max-width: 90vw;

      padding: 12px 18px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.92);

      box-shadow:
        0 6px 18px rgba(15,23,42,.08);

      color: #183A8F;

      font-size:
        clamp(16px,4vw,21px);

      font-weight: 800;

      text-align: center;

      line-height: 1.4;
    }
  </style>
</head>

<body>

  <main class="loader-screen">

    <div class="loader"></div>

    <div class="loading-message">
      กำลังเข้าสู่เว็บไซต์ใบยืมออนไลน์..
    </div>

  </main>

  <script>
    const GAS_WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzZF6SI1BU1xUiwgOYBPLtsNBtAeh8aAOZ6JY9rp-uD54G2hySJ5vIQAzPw2BiXfGQ/exec";

    function isStandalone() {
      try {
        if (navigator.standalone === true) {
          return true;
        }
      } catch(e) {}

      try {
        if (
          window.matchMedia &&
          window.matchMedia(
            "(display-mode: standalone)"
          ).matches
        ) {
          return true;
        }
      } catch(e) {}

      return false;
    }

    function openSystem() {
      const appMode =
        isStandalone()
          ? "1"
          : "0";

      const url =
        GAS_WEB_APP_URL +
        "?kmsLauncher=1" +
        "&kmsApp=" + appMode +
        "&from=github" +
        "&t=" + encodeURIComponent(Date.now());

      // ✅ เปิดหน้าเดิม ไม่เปิด tab ใหม่
      window.location.replace(url);
    }

    // ให้เห็น loader สั้น ๆ แล้วเข้า GAS อัตโนมัติ
    setTimeout(
      openSystem,
      350
    );
  </script>

</body>
</html>
