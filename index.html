<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 viewport-fit=cover">

  <title>ใบยืมสินค้าออนไลน์</title>

  <!-- iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ใบยืมสินค้าออนไลน์">

  <!-- Android / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#183A8F">

  <!-- ICON -->
  <link rel="apple-touch-icon"
        sizes="180x180"
        href="./kosin-app-icon-180.png">

  <link rel="apple-touch-icon-precomposed"
        sizes="180x180"
        href="./kosin-app-icon-180.png">

  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./kosin-app-icon-192.png">

  <link rel="icon"
        type="image/png"
        sizes="512x512"
        href="./kosin-app-icon-512.png">

  <link rel="manifest"
        href="./manifest.webmanifest">


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        radial-gradient(
          circle at top,
          rgba(37, 99, 235, .12),
          transparent 40%
        ),
        linear-gradient(
          160deg,
          #ffffff 0%,
          #eef4ff 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }


    /* ===============================
       หน้าหลัก
       =============================== */

    .loader-screen {

      position: fixed;
      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 18px;

      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

    }


    /* ===============================
       วงโหลด
       =============================== */

    .loader {

      width: 62px;
      height: 62px;

      border-radius: 50%;

      border-top:
        5px solid #FF6B35;

      border-bottom:
        5px solid #2563EB;

      border-left:
        5px solid transparent;

      border-right:
        5px solid transparent;

      animation:
        rotation 1s linear infinite;

      filter:
        drop-shadow(
          0 8px 18px
          rgba(37, 99, 235, .22)
        );

    }


    @keyframes rotation {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* ===============================
       ข้อความ Loader
       =============================== */

    .loading-message {

      padding:
        12px 18px;

      border-radius:
        999px;

      background:
        rgba(255, 255, 255, .92);

      box-shadow:
        0 6px 18px
        rgba(15, 23, 42, .08);

      color:
        #183A8F;

      font-size:
        clamp(
          16px,
          4vw,
          21px
        );

      font-weight:
        800;

      text-align:
        center;

      line-height:
        1.4;

    }


    /* ===============================
       ลิงก์ด้านล่าง
       =============================== */

    .open-area {

      margin-top:
        8px;

      text-align:
        center;

      opacity:
        0;

      transform:
        translateY(8px);

      transition:
        opacity .35s ease,
        transform .35s ease;

      pointer-events:
        none;

    }


    .open-area.show {

      opacity:
        1;

      transform:
        translateY(0);

      pointer-events:
        auto;

    }


    .open-text {

      color:
        #64748B;

      font-size:
        13px;

      font-weight:
        600;

      margin-bottom:
        8px;

    }


    .open-link {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        6px;

      min-height:
        44px;

      padding:
        10px 18px;

      border-radius:
        14px;

      background:
        #FFFFFF;

      border:
        1px solid
        #DCE6F7;

      box-shadow:
        0 8px 24px
        rgba(15, 23, 42, .08);

      color:
        #183A8F;

      font-size:
        14px;

      font-weight:
        800;

      text-decoration:
        none;

      transition:
        transform .15s ease,
        box-shadow .15s ease;

    }


    .open-link:active {

      transform:
        scale(.96);

    }


    /* ===============================
       MOBILE
       =============================== */

    @media (max-width: 600px) {

      .loader {

        width:
          58px;

        height:
          58px;

      }


      .loading-message {

        max-width:
          90vw;

        font-size:
          17px;

      }


      .open-link {

        min-height:
          48px;

        padding:
          11px 18px;

      }

    }

  </style>

</head>


<body>


  <div class="loader-screen">


    <!-- Loader -->
    <div
      class="loader">
    </div>


    <!-- ข้อความ -->
    <div
      class="loading-message">

      กำลังเข้าสู่เว็บไซต์ใบยืมออนไลน์..

    </div>


    <!-- ==========================================
         หลังโหลดเสร็จค่อยขึ้นลิงก์
         ========================================== -->

    <div
      id="openArea"
      class="open-area">


      <div
        class="open-text">

        โปรดคลิกที่ลิงก์ด้านล่างเพื่อเข้าสู่ระบบ

      </div>


      <a
        id="openSystemLink"
        class="open-link"

        href="https://script.google.com/macros/s/AKfycbzZF6SI1BU1xUiwgOYBPLtsNBtAeh8aAOZ6JY9rp-uD54G2hySJ5vIQAzPw2BiXfGQ/exec?kmsLauncher=1"

        target="_blank"

        rel="noopener">

        เปิดเว็บไซต์ใบยืมออนไลน์
        <span>›</span>

      </a>


    </div>


  </div>



  <script>

    /*
     * =============================================
     * สำคัญ
     * GitHub จะไม่ Redirect ไป GAS อัตโนมัติ
     * URL github.io จึงอยู่เหมือนเดิม
     * =============================================
     */


    const openArea =
      document.getElementById(
        "openArea"
      );


    /*
     * แสดงข้อความให้กดลิงก์
     * หลังประมาณ 1 วินาที
     */

    setTimeout(
      function() {

        openArea.classList.add(
          "show"
        );

      },
      1000
    );


  </script>


</body>
</html>
