<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
  >

  <title>ใบยืมสินค้าออนไลน์</title>

  <meta name="theme-color" content="#183A8F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ใบยืมสินค้าออนไลน์">

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./kosin-app-icon-180.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./kosin-app-icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./kosin-app-icon-512.png"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(circle at top,rgba(37,99,235,.12),transparent 40%),
        linear-gradient(160deg,#fff 0%,#eef4ff 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    .loader-screen{
      text-align:center;
    }

    .loader{
      width:62px;
      height:62px;
      margin:0 auto 18px;
      border-radius:50%;
      border-top:5px solid #FF6B35;
      border-bottom:5px solid #2563EB;
      border-left:5px solid transparent;
      border-right:5px solid transparent;
      animation:spin 1s linear infinite;
      filter:drop-shadow(0 8px 18px rgba(37,99,235,.22));
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .message{
      padding:12px 18px;
      border-radius:999px;
      background:rgba(255,255,255,.92);
      box-shadow:0 6px 18px rgba(15,23,42,.08);
      color:#183A8F;
      font-size:clamp(16px,4vw,21px);
      font-weight:800;
      line-height:1.4;
    }

    .error{
      display:none;
      width:min(92vw,460px);
      padding:20px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 18px 50px rgba(15,23,42,.12);
      text-align:center;
    }

    .error h2{
      color:#b91c1c;
    }

    .error button{
      border:0;
      border-radius:14px;
      padding:12px 18px;
      background:#183A8F;
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <main
    id="kmsBootLoader"
    class="loader-screen"
  >
    <div class="loader"></div>

    <div class="message">
      กำลังเข้าสู่เว็บไซต์ใบยืมออนไลน์..
    </div>
  </main>

  <section
    id="kmsBootError"
    class="error"
  >
    <h2>โหลดระบบไม่สำเร็จ</h2>

    <p id="kmsBootErrorText">
      กรุณาลองใหม่อีกครั้ง
    </p>

    <button
      type="button"
      onclick="location.reload()"
    >
      โหลดใหม่
    </button>
  </section>

  <script>
    const GAS_APP_URL =
      "https://script.google.com/macros/s/AKfycbzZF6SI1BU1xUiwgOYBPLtsNBtAeh8aAOZ6JY9rp-uD54G2hySJ5vIQAzPw2BiXfGQ/exec";

    function decodeUtf8Base64_(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);

      for(let i=0;i<binary.length;i++){
        bytes[i] = binary.charCodeAt(i);
      }

      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }

      let out = "";

      for(let i=0;i<bytes.length;i++){
        out += String.fromCharCode(bytes[i]);
      }

      try{
        return decodeURIComponent(escape(out));
      }catch(e){
        return out;
      }
    }

    function showBootError_(message) {
      const loader =
        document.getElementById("kmsBootLoader");

      const error =
        document.getElementById("kmsBootError");

      const text =
        document.getElementById("kmsBootErrorText");

      if(loader) loader.style.display = "none";
      if(error) error.style.display = "block";
      if(text) text.textContent = String(message || "โหลดระบบไม่สำเร็จ");
    }

    window.KMS_GITHUB_BOOT = function(payload) {
      if(
        !payload ||
        payload.ok !== true ||
        !payload.htmlB64
      ){
        showBootError_(
          payload &&
          payload.error &&
          payload.error.message
            ? payload.error.message
            : "Apps Script ไม่ส่งหน้าเว็บกลับมา"
        );
        return;
      }

      try{
        const html =
          decodeUtf8Base64_(
            payload.htmlB64
          );

        document.open();
        document.write(html);
        document.close();

      }catch(err){
        showBootError_(
          err && err.message
            ? err.message
            : String(err || "")
        );
      }
    };

    // Service Worker มีหน้าที่ PWA registration เท่านั้น
    // ไม่ดัก fetch/navigation
    if("serviceWorker" in navigator){
      navigator.serviceWorker
        .register(
          "./service-worker.js?v=20260903-shell1",
          {updateViaCache:"none"}
        )
        .then(function(reg){
          try{ reg.update(); }catch(e){}
        })
        .catch(function(err){
          console.warn("Service Worker:",err);
        });
    }

    // โหลด App Source จาก GAS
    const script =
      document.createElement("script");

    script.async = true;

    script.src =
      GAS_APP_URL +
      "?kmsAppBundle=1" +
      "&callback=KMS_GITHUB_BOOT" +
      "&_t=" +
      encodeURIComponent(Date.now());

    script.onerror = function() {
      showBootError_(
        "เชื่อมต่อ Google Apps Script ไม่สำเร็จ"
      );
    };

    document.head.appendChild(script);

    setTimeout(function(){
      const loader =
        document.getElementById("kmsBootLoader");

      if(loader){
        showBootError_(
          "โหลดระบบนานเกินไป กรุณากดโหลดใหม่"
        );
      }
    },30000);
  </script>

</body>
</html>
